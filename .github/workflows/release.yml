name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (solo para corridas manuales, sin tag)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Test, build & publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm Trusted Publishing support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Set package versions from tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -n "$VERSION" ]; then
            echo "Setting package version to: $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Verify Zero Vulnerabilities
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package dry-run
        run: npm pack --dry-run

      - name: Publish to npm with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          generate_release_notes: true
          draft: false
          prerelease: false
